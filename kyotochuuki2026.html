<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>くじ引き確率収束シミュレーション</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Helvetica Neue", "Hiragino Sans", sans-serif;
      background: #f0f2f5;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 16px;
      color: #2c3e50;
    }
    .controls {
      background: #fff;
      border-radius: 10px;
      padding: 16px 22px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: center;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label { font-weight: 600; font-size: 0.9rem; color: #555; }
    select, input[type="range"] {
      font-size: 0.95rem;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      font-size: 0.95rem;
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.96); }
    .btn-start { background: #27ae60; color: #fff; }
    .btn-start:hover { background: #219150; }
    .btn-reset { background: #e74c3c; color: #fff; }
    .btn-reset:hover { background: #c0392b; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .canvas-wrap {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: #fafbfc;
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 12px;
      font-size: 0.9rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .dot-a { background: #e74c3c; }
    .dot-b { background: #3498db; }
    .dot-theory { background: #95a5a6; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .stat-box {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      border-top: 3px solid #ddd;
    }
    .stat-box.a { border-color: #e74c3c; }
    .stat-box.b { border-color: #3498db; }
    .stat-box.theory { border-color: #95a5a6; }
    .stat-label { font-size: 0.8rem; color: #777; margin-bottom: 4px; }
    .stat-value { font-size: 1.4rem; font-weight: 700; color: #2c3e50; }
    .stat-sub { font-size: 0.8rem; color: #999; margin-top: 2px; }

    .speed-val { min-width: 40px; text-align: center; font-weight: 700; color: #27ae60; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎫 くじ引き確率 収束アニメーション</h1>

  <div class="controls">
    <div class="control-group">
      <label for="trials">試行回数</label>
      <select id="trials">
        <option value="100">100回</option>
        <option value="1000">1,000回</option>
        <option value="10000">10,000回</option>
        <option value="30000">30,000回</option>
        <option value="100000">100,000回</option>
        <option value="300000">300,000回</option>
        <option value="1000000">1,000,000回</option>
      </select>
    </div>
    <div class="control-group">
      <label for="speed">描画速度</label>
      <input type="range" id="speed" min="1" max="100" value="10">
      <span class="speed-val" id="speedVal">10x</span>
    </div>
    <button class="btn-start" id="btnStart" onclick="startSim()">▶ 開始</button>
    <button class="btn-reset" onclick="resetSim()">↺ リセット</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="graph" width="860" height="420"></canvas>
    <div class="legend">
      <div class="legend-item"><span class="dot dot-a"></span> Aさんの相対度数</div>
      <div class="legend-item"><span class="dot dot-b"></span> Bさんの相対度数</div>
      <div class="legend-item"><span class="dot dot-theory"></span> 理論値 1/6 ≈ 16.67%</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box a">
      <div class="stat-label">Aさんの確率（現在）</div>
      <div class="stat-value" id="statA">-</div>
      <div class="stat-sub" id="countA">-</div>
    </div>
    <div class="stat-box b">
      <div class="stat-label">Bさんの確率（現在）</div>
      <div class="stat-value" id="statB">-</div>
      <div class="stat-sub" id="countB">-</div>
    </div>
    <div class="stat-box theory">
      <div class="stat-label">理論値</div>
      <div class="stat-value">16.67%</div>
      <div class="stat-sub">1/6</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');

let animId = null;
let dataA = [];
let dataB = [];
let current = 0;
let total = 100;
let running = false;

const MARGIN = { top: 30, right: 40, bottom: 50, left: 60 };
const WIDTH = canvas.width - MARGIN.left - MARGIN.right;
const HEIGHT = canvas.height - MARGIN.top - MARGIN.bottom;
const THEORY = 1/6;

speedSlider.addEventListener('input', () => {
  speedVal.textContent = speedSlider.value + 'x';
});

function resetSim() {
  if (animId) cancelAnimationFrame(animId);
  running = false;
  current = 0;
  dataA = [];
  dataB = [];
  document.getElementById('btnStart').disabled = false;
  document.getElementById('statA').textContent = '-';
  document.getElementById('statB').textContent = '-';
  document.getElementById('countA').textContent = '-';
  document.getElementById('countB').textContent = '-';
  drawBase();
}

function drawBase() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.strokeStyle = '#e9ecef';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = MARGIN.top + (HEIGHT / 5) * i;
    ctx.beginPath(); ctx.moveTo(MARGIN.left, y); ctx.lineTo(MARGIN.left + WIDTH, y); ctx.stroke();
  }
  for (let i = 0; i <= 10; i++) {
    const x = MARGIN.left + (WIDTH / 10) * i;
    ctx.beginPath(); ctx.moveTo(x, MARGIN.top); ctx.lineTo(x, MARGIN.top + HEIGHT); ctx.stroke();
  }

  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(MARGIN.left, MARGIN.top);
  ctx.lineTo(MARGIN.left, MARGIN.top + HEIGHT);
  ctx.lineTo(MARGIN.left + WIDTH, MARGIN.top + HEIGHT);
  ctx.stroke();

  ctx.fillStyle = '#666';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const yMax = 0.35;
  for (let i = 0; i <= 7; i++) {
    const val = (yMax / 7) * i;
    const y = MARGIN.top + HEIGHT - (val / yMax) * HEIGHT;
    ctx.fillText((val * 100).toFixed(0) + '%', MARGIN.left - 10, y);
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const xMax = total;
  for (let i = 0; i <= 5; i++) {
    const val = Math.round((xMax / 5) * i);
    const x = MARGIN.left + (val / xMax) * WIDTH;
    ctx.fillText(val.toLocaleString(), x, MARGIN.top + HEIGHT + 10);
  }
  ctx.fillText('試行回数', MARGIN.left + WIDTH / 2, MARGIN.top + HEIGHT + 32);

  const theoryY = MARGIN.top + HEIGHT - (THEORY / yMax) * HEIGHT;
  ctx.strokeStyle = '#95a5a6';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath(); ctx.moveTo(MARGIN.left, theoryY); ctx.lineTo(MARGIN.left + WIDTH, theoryY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#95a5a6';
  ctx.textAlign = 'left';
  ctx.fillText('理論値 1/6', MARGIN.left + WIDTH + 8, theoryY);

  ctx.save();
  ctx.translate(18, MARGIN.top + HEIGHT / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#555';
  ctx.fillText('相対度数（あたり確率）', 0, 0);
  ctx.restore();
}

function drawLines(upTo) {
  drawBase();
  if (upTo < 1) return;

  const yMax = 0.35;

  function drawSeries(data, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < upTo; i++) {
      const x = MARGIN.left + ((i + 1) / total) * WIDTH;
      const y = MARGIN.top + HEIGHT - (data[i] / yMax) * HEIGHT;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    const lastX = MARGIN.left + (upTo / total) * WIDTH;
    const lastY = MARGIN.top + HEIGHT - (data[upTo - 1] / yMax) * HEIGHT;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI * 2); ctx.fill();
  }

  drawSeries(dataA, '#e74c3c');
  drawSeries(dataB, '#3498db');
}

function updateStats() {
  const aWin = Math.round(dataA[current - 1] * current);
  const bWin = Math.round(dataB[current - 1] * current);
  document.getElementById('statA').textContent = (dataA[current - 1] * 100).toFixed(2) + '%';
  document.getElementById('statB').textContent = (dataB[current - 1] * 100).toFixed(2) + '%';
  document.getElementById('countA').textContent = `${aWin} / ${current}回`;
  document.getElementById('countB').textContent = `${bWin} / ${current}回`;
}

function simulateStep() {
  const speed = parseInt(speedSlider.value);
  const batch = Math.max(1, Math.floor(speed * total / 500));
  const tickets = [1, 0, 0, 0, 0, 0];
  let aSum = current > 0 ? dataA[current - 1] * current : 0;
  let bSum = current > 0 ? dataB[current - 1] * current : 0;

  for (let k = 0; k < batch && current < total; k++) {
    for (let i = tickets.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tickets[i], tickets[j]] = [tickets[j], tickets[i]];
    }
    aSum += tickets[0];
    bSum += tickets[1];
    current++;
    dataA[current - 1] = aSum / current;
    dataB[current - 1] = bSum / current;
  }
}

function loop() {
  if (!running) return;
  simulateStep();
  drawLines(current);
  updateStats();

  if (current >= total) {
    running = false;
    document.getElementById('btnStart').disabled = false;
    return;
  }
  animId = requestAnimationFrame(loop);
}

function startSim() {
  if (running) return;
  total = parseInt(document.getElementById('trials').value);
  
  if (current === 0) {
    dataA = new Array(total);
    dataB = new Array(total);
  }
  
  running = true;
  document.getElementById('btnStart').disabled = true;
  loop();
}

resetSim();
</script>

</body>
</html>
