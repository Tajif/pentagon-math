<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>くじ引き確率シミュレーション</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.4rem;
      border-bottom: 2px solid #4a90d9;
      padding-bottom: 10px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    label {
      font-weight: bold;
      margin-right: 8px;
    }
    select, button {
      font-size: 1rem;
      padding: 8px 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background: #4a90d9;
      color: #fff;
      border: none;
      cursor: pointer;
      margin-left: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #357abd;
    }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }
    .result-box {
      background: #eef5fc;
      border-radius: 6px;
      padding: 15px;
      text-align: center;
    }
    .result-box h3 {
      margin: 0 0 8px;
      font-size: 0.95rem;
      color: #2c5aa0;
    }
    .big-number {
      font-size: 1.8rem;
      font-weight: bold;
      color: #222;
    }
    .percent {
      font-size: 1.1rem;
      color: #555;
      margin-top: 4px;
    }
    .answer-box {
      background: #fff8e1;
      border-left: 4px solid #ffc107;
      padding: 15px;
      margin-top: 15px;
      border-radius: 0 6px 6px 0;
    }
    .highlight {
      color: #d32f2f;
      font-weight: bold;
    }
    .log {
      margin-top: 15px;
      max-height: 200px;
      overflow-y: auto;
      background: #f1f3f4;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .theory {
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🎫 くじ引き確率シミュレーション</h1>

  <div class="card">
    <p>
      あたりくじが<strong>1本</strong>、はずれくじが<strong>5本</strong>の合計<strong>6本</strong>のくじがある。<br>
      Aさんが1本引き（<strong>戻さない</strong>）、その後Bさんが1本引く。
    </p>
    <p>
      <strong>問1:</strong> Bさんがあたりくじを引く確率は？<br>
      <strong>問2:</strong> AさんとBさんのあたりくじを引く確率の大小関係は？
      <span style="color:#666;font-size:0.9rem;">（ア）A＞B　（イ）A＜B　（ウ）A＝B</span>
    </p>
  </div>

  <div class="card">
    <label for="trials">試行回数:</label>
    <select id="trials">
      <option value="10">10回</option>
      <option value="100" selected>100回</option>
      <option value="500">500回</option>
      <option value="1000">1,000回</option>
      <option value="5000">5,000回</option>
      <option value="10000">10,000回</option>
      <option value="100000">100,000回</option>
    </select>
    <button onclick="runSimulation()">シミュレーション実行</button>
    <button onclick="toggleLog()" style="background:#6c757d;">詳細ログ ON/OFF</button>

    <div class="result-grid">
      <div class="result-box">
        <h3>Aさんのあたり回数</h3>
        <div class="big-number" id="a-count">-</div>
        <div class="percent" id="a-rate">-</div>
      </div>
      <div class="result-box">
        <h3>Bさんのあたり回数</h3>
        <div class="big-number" id="b-count">-</div>
        <div class="percent" id="b-rate">-</div>
      </div>
    </div>

    <div class="answer-box">
      <strong>理論値:</strong> Aさん＝Bさん＝<span class="theory">1/6 ≈ 16.67%</span><br>
      <span style="font-size:0.9rem;color:#555;">
        （Aが先に引いても、Bの確率は変わらず等しい → 正解は<span class="highlight">（ウ）</span>）
      </span>
    </div>

    <div class="log" id="log" style="display:none;"></div>
  </div>

  <script>
    let showLog = false;

    function toggleLog() {
      showLog = !showLog;
      document.getElementById('log').style.display = showLog ? 'block' : 'none';
    }

    function runSimulation() {
      const n = parseInt(document.getElementById('trials').value);
      let aWin = 0, bWin = 0;
      const logDiv = document.getElementById('log');
      logDiv.innerHTML = '';

      // くじの準備: [1, 0, 0, 0, 0, 0] （1があたり、0がはずれ）
      const tickets = [1, 0, 0, 0, 0, 0];

      for (let i = 1; i <= n; i++) {
        // 毎回同じ箱から引くイメージで、配列をコピーしてシャッフル
        const box = [...tickets];
        
        // Fisher-Yatesシャッフル
        for (let j = box.length - 1; j > 0; j--) {
          const k = Math.floor(Math.random() * (j + 1));
          [box[j], box[k]] = [box[k], box[j]];
        }

        const aDraw = box[0]; // Aさんが1本目を引く
        const bDraw = box[1]; // Bさんが2本目を引く（戻さないので残りから）

        if (aDraw === 1) aWin++;
        if (bDraw === 1) bWin++;

        if (showLog && i <= 200) { // ログ表示は最大200回まで
          const statusA = aDraw ? 'あたり' : 'はずれ';
          const statusB = bDraw ? 'あたり' : 'はずれ';
          logDiv.innerHTML += `第${i}回: A=${statusA}, B=${statusB}<br>`;
        }
      }

      if (showLog && n > 200) {
        logDiv.innerHTML += `... (${n}回中 最初の200回を表示)`;
      }

      document.getElementById('a-count').textContent = aWin + '回';
      document.getElementById('a-rate').textContent = ((aWin / n) * 100).toFixed(2) + '%';
      document.getElementById('b-count').textContent = bWin + '回';
      document.getElementById('b-rate').textContent = ((bWin / n) * 100).toFixed(2) + '%';
    }

    // 初回自動実行
    runSimulation();
  </script>

</body>
</html>
