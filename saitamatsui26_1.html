<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>階段さいころシミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [problem, setProblem] = useState('q1');
            const [posA, setPosA] = useState(3);
            const [posB, setPosB] = useState(null);
            const [isAnimating, setIsAnimating] = useState(false);
            const [results, setResults] = useState({});

            // タブ切り替え時の初期化
            useEffect(() => {
                setPosA(3);
                if (problem === 'q1') setPosB(null);
                else if (problem === 'q2') setPosB(1);
                else if (problem === 'q3') setPosB(2);
                
                setResults({});
            }, [problem]);

            const calculateFinalPos = (start, dice) => {
                let t = start + dice;
                return t <= 6 ? t : 12 - t;
            };

            const animateMove = async (start, dice, setPos) => {
                let current = start;
                let direction = 1;
                for (let i = 0; i < dice; i++) {
                    if (current === 6 && direction === 1) {
                        direction = -1;
                    }
                    current += direction;
                    setPos(current);
                    await new Promise(r => setTimeout(r, 200));
                }
            };

            const handleCellClick = async (diceA, diceB) => {
                const key = diceB === null ? `${diceA}` : `${diceA}-${diceB}`;
                if (results[key] || isAnimating) return;

                setIsAnimating(true);

                // 初期位置に戻す
                const startA = 3;
                const startB = problem === 'q1' ? null : (problem === 'q2' ? 1 : 2);
                setPosA(startA);
                setPosB(startB);

                await new Promise(r => setTimeout(r, 150));

                // Aの移動
                await animateMove(startA, diceA, setPosA);
                const finalPosA = calculateFinalPos(startA, diceA);

                // Bの移動
                let finalPosB = null;
                if (startB !== null && diceB !== null) {
                    await new Promise(r => setTimeout(r, 200));
                    await animateMove(startB, diceB, setPosB);
                    finalPosB = calculateFinalPos(startB, diceB);
                }

                // 判定
                let isHit = false;
                if (problem === 'q1') isHit = finalPosA === 5;
                if (problem === 'q2') isHit = finalPosA === finalPosB;
                if (problem === 'q3') isHit = finalPosB > finalPosA;

                setResults(prev => ({
                    ...prev,
                    [key]: { posA: finalPosA, posB: finalPosB, isHit }
                }));

                setIsAnimating(false);
            };

            return (
                <div className="max-w-4xl mx-auto p-2 sm:p-6">
                    <header className="mb-4 sm:mb-6 mt-2 text-center">
                        <h1 className="text-2xl sm:text-3xl font-bold text-gray-800 tracking-tight">階段さいころシミュレーター</h1>
                    </header>

                    {/* タブ */}
                    <div className="flex border-b-2 border-gray-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
                        {[
                            { id: 'q1', label: '（１）' },
                            { id: 'q2', label: '（２）' },
                            { id: 'q3', label: '（３）' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                className={`flex-1 py-3 sm:py-4 text-base sm:text-lg font-bold transition-colors ${problem === tab.id ? 'border-b-4 border-blue-600 text-blue-600 bg-blue-50' : 'text-gray-500 hover:bg-gray-50'}`}
                                onClick={() => { if(!isAnimating) setProblem(tab.id) }}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </div>

                    {/* 階段ビジュアライザー */}
                    <div className="bg-white p-4 sm:p-8 rounded-xl shadow-md border border-gray-200 mb-6">
                        <div className="relative w-full max-w-2xl mx-auto aspect-[2/1] mt-8 mb-4">
                            {/* SVG 背景 (図1の階段の枠線) */}
                            <svg viewBox="-2 -2 604 304" className="absolute top-0 left-0 w-full h-full" preserveAspectRatio="none">
                                <path d="M 0,250 L 100,250 L 100,200 L 200,200 L 200,150 L 300,150 L 300,100 L 400,100 L 400,50 L 500,50 L 500,0 L 600,0 L 600,300 L 0,300 Z" 
                                      fill="white" stroke="#1f2937" strokeWidth="4" strokeLinejoin="miter" />
                            </svg>

                            {/* アイコンと数字の配置用オーバーレイ */}
                            <div className="absolute top-0 left-0 w-full h-full flex">
                                {[1, 2, 3, 4, 5, 6].map(step => (
                                    <div key={step} className="flex-1 relative h-full">
                                        {/* 階段の数字 */}
                                        <div className="absolute left-1/2 -translate-x-1/2 font-serif text-2xl sm:text-3xl text-gray-800"
                                             style={{ bottom: `calc(${(step / 6) * 100}% - 40px)` }}>
                                            {step}
                                        </div>
                                        
                                        {/* キャラクターアイコン */}
                                        <div className="absolute left-0 w-full flex justify-center items-end" 
                                             style={{ bottom: `${(step / 6) * 100}%`, marginBottom: '4px' }}>
                                            {posA === step && (
                                                <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-red-600 text-white flex items-center justify-center font-bold text-xl shadow-md z-20 transform -translate-x-1 transition-transform duration-100"
                                                     style={{ transform: isAnimating ? 'translateY(-6px) translateX(-4px)' : 'translateX(-4px)' }}>
                                                    A
                                                </div>
                                            )}
                                            {posB === step && (
                                                <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xl shadow-md z-10 transform translate-x-1 transition-transform duration-100"
                                                     style={{ transform: isAnimating ? 'translateY(-6px) translateX(4px)' : 'translateX(4px)' }}>
                                                    B
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* パターン表 */}
                    <div className="bg-white p-3 sm:p-6 rounded-xl shadow-md border border-gray-200">
                        <h2 className="text-center font-bold text-lg mb-4 text-gray-700">パターンの確認（セルをタップ/クリックで動きます）</h2>
                        
                        <div className="overflow-x-auto">
                            {problem === 'q1' ? (
                                // 問1の表 (1行6列)
                                <table className="w-full text-center border-collapse border border-gray-300 min-w-[300px]">
                                    <thead>
                                        <tr>
                                            <th className="border border-gray-300 p-2 sm:p-3 bg-gray-200 w-1/4">Aの目</th>
                                            {[1,2,3,4,5,6].map(d => <th key={d} className="border border-gray-300 p-2 sm:p-3 bg-red-100 text-red-800 text-lg">{d}</th>)}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <th className="border border-gray-300 p-2 sm:p-3 bg-gray-100">結果</th>
                                            {[1,2,3,4,5,6].map(d => {
                                                const res = results[d];
                                                return (
                                                    <td key={d} className={`border border-gray-300 h-16 sm:h-20 p-0 transition-colors ${res ? (res.isHit ? 'bg-yellow-200 font-bold border-yellow-400' : 'bg-gray-50') : 'hover:bg-gray-100'}`}>
                                                        {!res ? (
                                                            <button onClick={() => handleCellClick(d, null)} disabled={isAnimating} className="w-full h-full flex items-center justify-center text-gray-300 hover:text-red-500 hover:scale-125 transition-transform text-2xl">
                                                                ▶
                                                            </button>
                                                        ) : (
                                                            <div className="flex items-center justify-center h-full text-lg sm:text-xl text-red-700">
                                                                A:{res.posA}段
                                                            </div>
                                                        )}
                                                    </td>
                                                )
                                            })}
                                        </tr>
                                    </tbody>
                                </table>
                            ) : (
                                // 問2・3の表 (6x6)
                                <table className="w-full text-center border-collapse border border-gray-300 min-w-[350px]">
                                    <thead>
                                        <tr>
                                            <th className="border border-gray-300 p-2 bg-gray-200 w-12 sm:w-16 whitespace-nowrap text-sm sm:text-base">A＼B</th>
                                            {[1,2,3,4,5,6].map(b => <th key={b} className="border border-gray-300 p-2 bg-blue-100 text-blue-800 text-lg">{b}</th>)}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {[1,2,3,4,5,6].map(a => (
                                            <tr key={a}>
                                                <th className="border border-gray-300 p-2 bg-red-100 text-red-800 text-lg">{a}</th>
                                                {[1,2,3,4,5,6].map(b => {
                                                    const key = `${a}-${b}`;
                                                    const res = results[key];
                                                    return (
                                                        <td key={b} className={`border border-gray-300 h-12 sm:h-16 p-0 transition-colors ${res ? (res.isHit ? 'bg-yellow-200 font-bold border-yellow-400' : 'bg-gray-50 text-gray-500') : 'hover:bg-purple-50'}`}>
                                                            {!res ? (
                                                                <button onClick={() => handleCellClick(a, b)} disabled={isAnimating} className="w-full h-full flex items-center justify-center text-gray-200 hover:text-purple-500 hover:scale-125 transition-transform text-xl">
                                                                    ▶
                                                                </button>
                                                            ) : (
                                                                <div className="flex flex-col items-center justify-center h-full text-sm sm:text-base leading-tight">
                                                                    <div className="text-red-600">A:{res.posA}</div>
                                                                    <div className="text-blue-600">B:{res.posB}</div>
                                                                </div>
                                                            )}
                                                        </td>
                                                    )
                                                })}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
